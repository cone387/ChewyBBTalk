[project]
name = "chewy-space"
version = "0.1.0"
description = "BBTalk Backend Service"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "Django>=5.2",
    "djangorestframework>=3.14.0",
    "django-cors-headers>=4.3.0",
    "django-filter>=24.0",
    "drf-spectacular>=0.27.0",
    "psycopg2-binary>=2.9.9",
    "chewy-attachment[django-s3]==0.5.2",
    "PyJWT[crypto]>=2.8.0",
    "requests>=2.31.0",
    "djangorestframework-simplejwt>=5.5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.coverage.run]
branch = true
source = ["chewy_space/bbtalk"]
omit = ["*/test*.py", "*/migrations/*", "*/__init__.py"]

[tool.coverage.report]
show_missing = true

[tool.coverage.html]
directory = "coverage/html"

[tool.coverage.json]
output = "coverage/coverage.json"

[tool.coverage.xml]
output = "coverage/coverage.xml"

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "coverage>=7.16.2",
    "httpx>=0.28,<1",
]

[project.scripts]
# 用法: uv run dev / uv run migrate / uv run init ...
dev = "cli:dev"
migrate = "cli:migrate"
init = "cli:init"
makemigrations = "cli:makemigrations"
collectstatic = "cli:collectstatic"
test = "cli:test"
shell = "cli:shell"

[project]
name = "bbtalk-backend"
version = "0.1.0"
description = "BBTalk Backend Service"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "psycopg2-binary>=2.9.9",
    "PyJWT[crypto]>=2.8.0",
    "sqlalchemy[asyncio]>=2.0,<3",
    "alembic>=1.15,<2",
    "python-multipart>=0.0.20",
    "boto3>=1.35",
    "sqladmin>=0.20,<1",
    "itsdangerous>=2.2",
    "pymysql>=1.1",
    "tzdata>=2025.1",
    "cryptography>=44",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.coverage.run]
branch = true
source = ["main", "application", "api", "services", "models", "schemas", "core", "database", "storage", "backups", "admin", "cli"]
omit = ["*/test*.py", "*/migrations/*"]

[tool.coverage.report]
show_missing = true

[tool.coverage.html]
directory = "coverage/html"

[tool.coverage.json]
output = "coverage/coverage.json"

[tool.coverage.xml]
output = "coverage/coverage.xml"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
only-include = ["main.py", "application.py", "api", "services", "models", "schemas", "core", "database", "storage", "backups", "admin", "cli", "templates"]

[tool.hatch.build.targets.sdist]
only-include = ["main.py", "application.py", "api", "services", "models", "schemas", "core", "database", "storage", "backups", "admin", "cli", "templates", "tests", "tools", "pyproject.toml", "uv.lock", "README.md", "Dockerfile", ".dockerignore"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["database/migrations"]

[tool.ruff.lint.isort]
known-first-party = ["main", "application", "api", "services", "models", "schemas", "core", "database", "storage", "backups", "admin", "cli"]

[tool.ruff.format]
quote-style = "single"

[dependency-groups]
dev = [
    "coverage>=7.16.2",
    "httpx>=0.28,<1",
    "pytest>=8",
]

[project.scripts]
# 用法: uv run dev / uv run migrate / uv run init ...
dev = "cli.commands:dev"
migrate = "cli.commands:migrate"
init = "cli.commands:init"
test = "cli.commands:test"
bbtalk = "cli.commands:main"

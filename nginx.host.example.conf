# ========================================================
# 宿主机 Nginx 配置示例
# 用于 docker-compose 部署方式（前端+后端容器）
# ========================================================

server {
    listen 80;
    server_name your-domain.com;  # 修改为你的域名
    
    # 与根 .env 的 NGINX_CLIENT_MAX_BODY_SIZE 保持一致。
    client_max_body_size 513M;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types text/plain text/css text/javascript application/json application/javascript image/svg+xml;

    # 附件只经后端鉴权读取。
    location ^~ /media/ {
        return 404;
    }

    # 所有应用入口交给前端容器 Nginx，由它转发 API、管理后台和公共页面。
    location / {
        proxy_pass http://127.0.0.1:4010;  # 前端容器端口
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

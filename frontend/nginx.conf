# An outer TLS proxy must overwrite this header before forwarding requests.
map $http_x_forwarded_proto $external_scheme {
    default $scheme;
    https https;
}

server {
    listen 4010;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # 客户端最大上传大小
    client_max_body_size ${NGINX_CLIENT_MAX_BODY_SIZE};

    # Gzip 压缩
    gzip on;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/json application/javascript image/svg+xml;

    # 原生后端入口优先于前端扩展名匹配（包括 SQLAdmin 静态资源）。
    location ~ ^/(api|admin|privacy-policy|support)(/|$)|^/(healthz|docs|redoc|openapi\.json)$ {
        proxy_pass http://chewybbtalk-backend:8020;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $external_scheme;
    }

    # 附件只经后端鉴权读取。
    location ^~ /media/ {
        return 404;
    }

    # Service Worker 文件
    location = /sw.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Content-Type "application/javascript";
    }

    # 前端assets目录（优先匹配）
    location ^~ /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 前端静态资源
    location ~* \.(js|mjs|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # SPA 路由支持（最后匹配）
    location / {
        try_files $uri $uri/ /index.html;
    }
}

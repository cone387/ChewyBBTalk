appId: com.chewybbtalk.desktop
productName: ChewyBBTalk
directories:
  buildResources: resources
  output: dist
files:
  - out/**/*
  - "!out/types-*"
  - "!out/main/integration.js"

extraResources:
  - from: resources/icon.png
    to: icon.png
  - from: resources/icon.ico
    to: icon.ico
  - from: resources/tray.png
    to: tray.png
  - from: resources/trayTemplate.png
    to: trayTemplate.png
  - from: resources/trayTemplate@2x.png
    to: trayTemplate@2x.png

publish:
  provider: generic
  url: https://github.com/cone387/ChewyBBTalk/releases/download/desktop-stable

mac:
  category: public.app-category.utilities
  icon: resources/icon.icns
  target:
    - target: dmg
      arch:
        - universal
    - target: zip
      arch:
        - universal

dmg:
  sign: false

win:
  icon: resources/icon.ico
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true

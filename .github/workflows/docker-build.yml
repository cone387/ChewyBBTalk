name: Build and Push Docker Images

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: cone387/chewy-bbtalk

jobs:
  deployment-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
    - name: Validate deployment scripts
      run: |
        bash -n scripts/deploy-image.sh
        bash -n deploy.sh
        python3 -m unittest discover -s scripts/tests -v

  build:
    needs: deployment-tests
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push
      id: image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64

  # 自动部署到服务器
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    env:
      DEPLOY_COMMIT: ${{ github.sha }}
      DEPLOY_IMAGE: ghcr.io/cone387/chewy-bbtalk@${{ needs.build.outputs.digest }}
      DEPLOY_DIR: ${{ secrets.DEPLOY_PATH || '/home/bzl/projects/ChewyBBTalk' }}
    
    steps:
    - name: Deploy to server via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.DEPLOY_HOST }}
        username: ${{ secrets.DEPLOY_USER }}
        key: ${{ secrets.DEPLOY_KEY }}
        port: ${{ secrets.DEPLOY_PORT || 22 }}
        command_timeout: 30m
        envs: DEPLOY_COMMIT,DEPLOY_IMAGE,DEPLOY_DIR
        script: |
          set -eu
          cd "$DEPLOY_DIR"
          latest=$(timeout --kill-after=5 30 git ls-remote origin refs/heads/master | cut -f1)
          if [ -z "$latest" ]; then
            echo '无法确认远端版本，停止部署'
            exit 1
          fi
          if [ "$latest" != "$DEPLOY_COMMIT" ]; then
            echo '跳过已被更新提交替代的构建'
            exit 0
          fi
          timeout --kill-after=5 60 git fetch origin "$DEPLOY_COMMIT"
          deploy_script=$(mktemp)
          trap 'rm -f "$deploy_script"' EXIT
          git show "$DEPLOY_COMMIT:scripts/deploy-image.sh" > "$deploy_script"
          # End the remote process group before the SSH action's 30 minute
          # observation deadline, including children left by a stalled pull.
          timeout --kill-after=15 1500 bash "$deploy_script" "$DEPLOY_IMAGE"

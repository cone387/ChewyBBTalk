name: Continuous Integration

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: '0.11.7'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run business and FastAPI HTTP contract tests
        run: |
          uv run coverage run -m pytest
          uv run coverage json
          uv run coverage xml
          uv run coverage html
          uv run coverage report

      - name: Set up Node for coverage gate
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check backend coverage baseline
        run: node ../scripts/check-coverage.mjs backend

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: backend/coverage/
          retention-days: 14

  backend-postgres:
    name: Backend PostgreSQL concurrency
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bbtalk_test
          POSTGRES_PASSWORD: bbtalk_test
          POSTGRES_DB: bbtalk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bbtalk_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://bbtalk_test:bbtalk_test@127.0.0.1:5432/bbtalk_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.11.7'
      - run: uv sync --frozen
      - name: Verify durable submissions and conditional edits with real row locks
        run: uv run pytest tests/test_concurrency.py -q

  mobile:
    name: Mobile tests and types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Jest tests
        run: npm run test:coverage

      - name: Check mobile coverage baseline
        run: node ../scripts/check-coverage.mjs mobile

      - name: Upload mobile coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-mobile
          path: mobile/coverage/
          retention-days: 14

      - name: Mobile screen integration
        run: npm run test:integration

      - name: Typecheck
        run: npx tsc --noEmit

  desktop:
    name: Desktop tests, types, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest tests
        run: npm run test:coverage

      - name: Check desktop coverage baseline
        run: node ../scripts/check-coverage.mjs desktop

      - name: Upload desktop coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-desktop
          path: desktop/coverage/
          retention-days: 14

      - name: Typecheck
        run: npm run typecheck

      - name: Build renderer and main process
        run: npm run build

  frontend:
    name: Web frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Web regression tests
        run: npm run test:coverage

      - name: Coverage gate regression tests
        run: node --test ../scripts/tests/check-coverage.test.mjs

      - name: Check Web coverage baseline
        run: node ../scripts/check-coverage.mjs frontend

      - name: Upload Web coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-web
          path: frontend/coverage/
          retention-days: 14

      - name: Lint Web client
        run: npm run lint

      # frontend/ remains the deployed Web client. Do not replace this
      # with an Expo Web build; mobile Web is not part of the deployment path.
      - name: Build Web
        run: npm run build

      - name: Set up Python for isolated browser backend
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: '0.11.7'

      - name: Install browser backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Install Chromium
        run: npx playwright install --with-deps --no-shell chromium firefox webkit

      - name: Web browser regression
        run: npm run test:e2e

      - name: Upload browser test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-browser-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7


      - name: Install desktop integration dependencies
        run: npm ci --prefix ../desktop

      - name: Build actual Electron integration entry
        run: npm --prefix ../desktop run build:integration

      - name: Electron window and real backend regression
        run: xvfb-run -a npm run test:desktop

      - name: Upload Electron integration artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-window-report
          path: frontend/desktop-test-results/
          retention-days: 7

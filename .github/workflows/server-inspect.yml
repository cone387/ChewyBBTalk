name: Inspect production data before migration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency:
      group: production-inspection
      cancel-in-progress: false
    env:
      DEPLOY_DIR: ${{ secrets.DEPLOY_PATH || '/home/bzl/projects/ChewyBBTalk' }}
    steps:
      - name: Read production container and data locations
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 5m
          envs: DEPLOY_DIR
          script: |
            set -eu
            cd "$DEPLOY_DIR"
            printf 'DEPLOY_DIRECTORY=%s\n' "$PWD"
            df -Pk .
            docker --version
            docker ps -a --filter name=chewy --format 'PROJECT_CONTAINER={{.Names}} STATUS={{.Status}} IMAGE={{.Image}}'
            docker images --filter reference=ghcr.io/cone387/chewy-bbtalk --format 'PROJECT_IMAGE={{.ID}} {{.Repository}}:{{.Tag}} {{.Size}}'
            printf 'REGISTRY_CONNECTIVITY='
            curl --connect-timeout 8 --max-time 15 --silent --output /dev/null --write-out '%{http_code}\n' https://ghcr.io/v2/ || true
            python3 - <<'PY'
            import json, pathlib, os, subprocess
            root = pathlib.Path.cwd().parent / 'migration-backups'
            if root.is_dir():
                for directory in sorted(root.iterdir(), key=lambda item: item.stat().st_mtime)[-3:]:
                    if directory.is_dir():
                        print(json.dumps({'backup_run': directory.name,
                            'completed_files': sorted(path.name for path in directory.iterdir() if path.is_file()),
                            'dump_bytes': (directory / 'database.dump').stat().st_size if (directory / 'database.dump').exists() else 0}))
                        if (directory / 'CUTOVER_COMPLETE').is_file():
                            import hashlib
                            checksums = json.loads((directory / 'backup.sha256.json').read_text())
                            for name, expected in checksums.items():
                                with (directory / name).open('rb') as source:
                                    digest = hashlib.sha256()
                                    for chunk in iter(lambda: source.read(1024 * 1024), b''):
                                        digest.update(chunk)
                                if digest.hexdigest() != expected:
                                    raise RuntimeError('Completed cutover backup checksum mismatch')
                            print(json.dumps({'completed_cutover': directory.name, 'backup_checksums_verified': len(checksums)}))
                        diagnostics = directory / 'diagnostics.log'
                        if diagnostics.is_file():
                            for line in diagnostics.read_text(encoding='utf8', errors='replace').splitlines():
                                if line.startswith('AUTHENTICATED_SMOKE_FAILED: '):
                                    print(line)
                                try:
                                    record = json.loads(line)
                                except ValueError:
                                    continue
                                keys = ('users_checked', 'feeds_checked', 'attachment_metadata_checked', 'local_downloads_checked', 'cloud_attachments', 'missing_local_files')
                                if isinstance(record, dict) and all(key in record for key in keys):
                                    print(json.dumps({key: record[key] for key in keys}))

            PY
            if test -f .env; then echo ROOT_ENV_PRESENT=yes; else echo ROOT_ENV_PRESENT=no; fi
            python3 - <<'PY'
            import json, pathlib, os, subprocess
            code = "import json,os,psycopg2; c=psycopg2.connect(os.environ['DATABASE_URL']); c.set_session(readonly=True); q=c.cursor(); q.execute('SELECT id::text,storage_path,size FROM cb_attachments'); print(json.dumps(q.fetchall())); c.close()"
            rows = json.loads(subprocess.check_output(['docker','exec','chewy-bbtalk','python','-c',code]))
            info = json.loads(subprocess.check_output(['docker','inspect','chewy-bbtalk']))[0]
            source = pathlib.Path(next(item['Source'] for item in info['Mounts'] if item['Destination']=='/app/data')) / 'media' / 'attachments'
            missing = {pathlib.PurePosixPath(key).name: (uid,key,size) for uid,key,size in rows if not (source / key).is_file()}
            found = []
            roots = [pathlib.Path.cwd().parent, pathlib.Path.cwd().parent.parent / 'backups']
            visited = 0
            for root in roots:
                if not root.is_dir():
                    continue
                for parent, folders, files in os.walk(root, followlinks=False):
                    folders[:] = [name for name in folders if name not in ('.git','node_modules','.venv','__pycache__')]
                    for name in files:
                        if name in missing:
                            path = pathlib.Path(parent) / name
                            if path.is_file() and not path.is_symlink():
                                uid,key,size = missing[name]
                                found.append({'id':uid, 'path':str(path), 'expected_bytes':size, 'actual_bytes':path.stat().st_size})
                    visited += 1
            backups = pathlib.Path.cwd().parent / 'migration-backups'
            completed = [path for path in backups.iterdir() if (path / 'verify.json').is_file()]
            if completed:
                report = max(completed, key=lambda item: item.stat().st_mtime) / 'attachment-source-audit.json'
                report.write_text(json.dumps({'missing_record_ids':[value[0] for value in missing.values()], 'found':found}, sort_keys=True), encoding='utf8')
                report.chmod(0o600)
            print(json.dumps({'host_attachment_search':{'missing_unique_filenames':len(missing), 'matching_files':len(found), 'matched_records':len({item['id'] for item in found}), 'directories_checked':visited}}))
            PY

            for name in chewy-bbtalk chewybbtalk chewybbtalk-backend chewy-bbtalk-previous; do
              if docker container inspect "$name" >/dev/null 2>&1; then
                docker inspect --format 'NAME={{.Name}} IMAGE={{.Config.Image}} IMAGE_ID={{.Image}} STATUS={{.State.Status}} MOUNTS={{json .Mounts}}' "$name"
                if test "$(docker inspect --format '{{.State.Running}}' "$name")" = true; then
                  docker exec -i "$name" python - <<'PY'
            import json, os, pathlib, sqlite3
            from urllib.parse import urlsplit
            result = {'paths': {key: os.environ.get(key) for key in ('DATA_DIR', 'MEDIA_ROOT')},
                      'secret_key_in_environment': bool(os.environ.get('SECRET_KEY'))}
            url = os.environ.get('DATABASE_URL', '')
            parsed = urlsplit(url)
            result['database'] = {'scheme': parsed.scheme, 'host': parsed.hostname,
                                  'port': parsed.port, 'path': parsed.path}
            candidates = {pathlib.Path('/app/data/db/db.sqlite3'),
                          pathlib.Path('/app/backend/var/db.sqlite3'),
                          pathlib.Path('/app/backend/chewy_space/db.sqlite3')}
            if url.startswith('sqlite:///'):
                candidates.add(pathlib.Path(url[len('sqlite:///'):]).resolve())
            result['sqlite_files'] = []
            for path in sorted(candidates):
                if not path.is_file():
                    continue
                with sqlite3.connect(path.as_uri() + '?mode=ro', uri=True) as db:
                    tables = [row[0] for row in db.execute("SELECT name FROM sqlite_master WHERE type='table'")]
                    counts = {}
                    for table in tables:
                        if table.startswith(('cb_', 'token_blacklist_', 'django_', 'auth_')):
                            quoted = '"' + table.replace('"', '""') + '"'
                            counts[table] = db.execute('SELECT count(*) FROM ' + quoted).fetchone()[0]
                    revision = db.execute('SELECT version_num FROM alembic_version').fetchall() if 'alembic_version' in tables else []
                    result['sqlite_files'].append({'path': str(path), 'bytes': path.stat().st_size,
                        'revision': revision, 'counts': counts})
            print(json.dumps(result, ensure_ascii=False))
            details = {'working_directory': os.getcwd()}
            details['old_entrypoints'] = [str(path) for path in pathlib.Path('/app/backend').rglob('manage.py')]
            modules = []
            if pathlib.Path('/app/backend/manage.py').is_file():
                import ast, importlib, sys
                sys.dont_write_bytecode = True
                sys.path.insert(0, '/app/backend')
                tree = ast.parse(pathlib.Path('/app/backend/manage.py').read_text())
                modules = [node.args[1].value for node in ast.walk(tree) if isinstance(node, ast.Call) and len(node.args) >= 2 and isinstance(node.args[0], ast.Constant) and node.args[0].value == 'DJANGO_SETTINGS_MODULE' and isinstance(node.args[1], ast.Constant)]
                if modules:
                    settings = importlib.import_module(modules[0])
                    details['effective_old_storage'] = {key: str(getattr(settings, key, '')) for key in ('MEDIA_ROOT', 'BASE_DIR', 'DEFAULT_FILE_STORAGE')}
                    details['effective_cloud_keys_present'] = {key: bool(getattr(settings, key, None)) for key in ('AWS_ACCESS_KEY_ID', 'AWS_SECRET_ACCESS_KEY', 'AWS_STORAGE_BUCKET_NAME')}
                    details['attachment_settings_names'] = [key for key in vars(settings) if 'ATTACH' in key or 'STORAGE' in key]
                    attachment_config = getattr(settings, 'CHEWY_ATTACHMENT', {})
                    details['effective_attachment_paths'] = {key: str(value) for key, value in attachment_config.items() if any(part in key.upper() for part in ('ROOT', 'PATH', 'DIR', 'BACKEND')) and isinstance(value, (str, pathlib.Path))}



            if parsed.scheme in ('postgres', 'postgresql'):
                import psycopg2
                from psycopg2 import sql
                with psycopg2.connect(url) as db:
                    db.set_session(readonly=True)
                    with db.cursor() as cursor:
                        cursor.execute("SELECT tablename FROM pg_tables WHERE schemaname='public'")
                        tables = [row[0] for row in cursor.fetchall()]
                        details['counts'] = {}
                        if 'cb_attachments' in tables:
                            cursor.execute('SELECT storage_path FROM cb_attachments')
                            keys = [row[0] for row in cursor.fetchall()]
                            details['attachment_path_matches'] = []
                            base = pathlib.Path('/app/data/media/attachments')
                            missing = [key for key in keys if not (base / key).is_file()]
                            wanted = {pathlib.PurePosixPath(key).name for key in missing}
                            found = 0
                            for search in ('/app', '/data', '/tmp'):
                                for parent, folders, files in os.walk(search, followlinks=False):
                                    folders[:] = [name for name in folders if name not in ('node_modules', '__pycache__', '.git')]
                                    found += sum(name in wanted for name in files)
                            details['missing_files_found_elsewhere_in_container'] = found
                            if modules and missing:
                                import jwt, time, urllib.request, urllib.error
                                from uuid import uuid4
                                from urllib.parse import urlsplit
                                cursor.execute('SELECT a.id::text,a.storage_path,a.owner_id,u.credential_version FROM cb_attachments a JOIN cb_users u ON a.owner_id=u.id::text WHERE u.is_active')
                                audit = {'metadata_readable': 0, 'content_statuses': {}, 'unverified': 0}
                                for uid,key,owner,version in cursor.fetchall():
                                    if key not in missing:
                                        continue
                                    token = jwt.encode({'user_id': int(owner), 'credential_version': version, 'token_type': 'access', 'jti': uuid4().hex, 'iat': int(time.time()), 'exp': int(time.time())+120}, settings.SECRET_KEY, algorithm='HS256')
                                    def fetch(path):
                                        request = urllib.request.Request('http://127.0.0.1:4010'+path, headers={'Authorization':'Bearer '+token})
                                        try:
                                            return urllib.request.urlopen(request, timeout=5)
                                        except urllib.error.HTTPError as error:
                                            return error
                                    try:
                                        with fetch('/api/v1/attachments/files/'+uid+'/') as response:
                                            if response.status != 200:
                                                audit['unverified'] += 1
                                                continue
                                            item = json.load(response)
                                        audit['metadata_readable'] += 1
                                        url = item.get('download_url') or item.get('preview_url') or ''
                                        path = urlsplit(url).path
                                        if not path.startswith('/api/v1/attachments/'):
                                            audit['unverified'] += 1
                                            continue
                                        with fetch(path) as response:
                                            status = str(response.status)
                                            audit['content_statuses'][status] = audit['content_statuses'].get(status,0)+1
                                    except Exception:
                                        audit['unverified'] += 1
                                details['old_service_missing_attachment_reads'] = audit


                            for root in ('/app/data/media/attachments', '/app/data/media', '/app/media', '/app/backend/media', '/app/backend/chewy_space/media'):
                                base = pathlib.Path(root)
                                found = [base / key for key in keys if not pathlib.Path(key).is_absolute() and '..' not in pathlib.Path(key).parts and (base / key).is_file()]
                                details['attachment_path_matches'].append({'root': root, 'matching_records': len(found), 'unique_files': len(set(found))})

                        for table in tables:
                            if table.startswith(('cb_', 'token_blacklist_', 'django_', 'auth_')):
                                cursor.execute(sql.SQL('SELECT count(*) FROM {}').format(sql.Identifier(table)))
                                details['counts'][table] = cursor.fetchone()[0]
                        cursor.execute('SHOW server_version')
                        details['postgres_version'] = cursor.fetchone()[0]
                        cursor.execute('SELECT pg_database_size(current_database())')
                        details['database_bytes'] = cursor.fetchone()[0]
                        cursor.execute('SELECT rolcreatedb FROM pg_roles WHERE rolname=current_user')
                        details['can_create_database'] = cursor.fetchone()[0]
                        cursor.execute('SELECT state,count(*) FROM pg_stat_activity WHERE datname=current_database() GROUP BY state')
                        details['connections'] = cursor.fetchall()
                        if 'alembic_version' in tables:
                            cursor.execute('SELECT version_num FROM alembic_version')
                            details['revision'] = cursor.fetchall()
                        if 'django_migrations' in tables:
                            cursor.execute('SELECT app,name FROM django_migrations ORDER BY id DESC LIMIT 12')
                            details['historical_migrations'] = cursor.fetchall()
            if not modules:
                import importlib.util, urllib.request, urllib.error
                details['django_package_installed'] = importlib.util.find_spec('django') is not None
                details['http_checks'] = {}
                for endpoint, expected in (('/healthz', 200), ('/api/schema/', 200), ('/api/v1/bbtalk/user/me', 401)):
                    try:
                        response = urllib.request.urlopen('http://127.0.0.1:4010' + endpoint, timeout=10)
                    except urllib.error.HTTPError as error:
                        response = error
                    with response:
                        if response.status != expected:
                            raise RuntimeError('Native service HTTP check failed')
                        details['http_checks'][endpoint] = response.status
            details['directories'] = []
            for path in {pathlib.Path('/app/data'), pathlib.Path(os.environ.get('DATA_DIR', '/app/data')),
                         pathlib.Path(os.environ.get('MEDIA_ROOT', '/app/data/media'))}:
                count, size, links = 0, 0, 0
                if path.is_dir():
                    for parent, folders, files in os.walk(path, followlinks=False):
                        for name in files:
                            item = pathlib.Path(parent) / name
                            if item.is_symlink():
                                links += 1
                            elif item.is_file():
                                count += 1
                                size += item.stat().st_size
                details['directories'].append({'path': str(path), 'exists': path.exists(), 'files': count, 'bytes': size, 'symlinks': links})
            print(json.dumps(details, ensure_ascii=False, default=list))
            PY
                fi
              fi
            done

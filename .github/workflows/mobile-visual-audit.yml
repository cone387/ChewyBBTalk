name: iOS native visual audit
on:
  workflow_dispatch:
    inputs:
      audit_scope:
        description: 'Native flows to run'
        type: choice
        options: [all, welcome]
        default: all
      reuse_build_run:
        description: 'Optional previous audit run; reuse only when application sources are identical'
        type: string
        required: false
  push:
    branches: [audit/mobile-glass]
permissions:
  contents: read
  actions: read
concurrency:
  group: native-visual-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      CI: '1'
      MAESTRO_CLI_NO_ANALYTICS: '1'
      MAESTRO_DRIVER_STARTUP_TIMEOUT: '300000'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare iOS 26 simulator
        run: |
          mkdir -p mobile/test-results/native-visual
          XCODE_PATH=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -1)
          test -n "$XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version | tee mobile/test-results/native-visual/xcode.txt
          xcrun simctl list devices available -j > mobile/test-results/native-visual/devices.json
          python3 scripts/mobile-visual/prepare-simulator.py >> "$GITHUB_ENV"
      - name: Install dependencies and native project
        if: ${{ !inputs.reuse_build_run }}
        working-directory: mobile
        run: |
          npm ci --no-audit
          node ../scripts/mobile-visual/configure-build.cjs
          npx expo prebuild --platform ios --no-install
          pod install --project-directory=ios
      - name: Build actual Release app for simulator
        if: ${{ !inputs.reuse_build_run }}
        working-directory: mobile
        run: |
          set -o pipefail
          # Simulator ad-hoc signing embeds the application identifier required by
          # Keychain. Disabling signing compiles but SecureStore fails with -34018.
          xcodebuild -workspace ios/BBTalk.xcworkspace -scheme BBTalk -configuration Release -sdk iphonesimulator -destination "id=$SIMULATOR_UDID" -derivedDataPath build/visual CODE_SIGN_IDENTITY=- ONLY_ACTIVE_ARCH=YES build > test-results/native-visual/build.log 2>&1
      - name: Preserve simulator binary for additional flows
        if: ${{ !inputs.reuse_build_run }}
        run: tar -czf mobile/test-results/native-visual/simulator-app.tar.gz -C mobile/build/visual/Build/Products/Release-iphonesimulator BBTalk.app
      - uses: actions/download-artifact@v4
        if: ${{ inputs.reuse_build_run }}
        with:
          name: ios-native-visual
          run-id: ${{ inputs.reuse_build_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/previous-audit
      - name: Verify and reuse unchanged application binary
        if: ${{ inputs.reuse_build_run }}
        env:
          PREVIOUS_AUDIT: ${{ runner.temp }}/previous-audit
        run: |
          set -euo pipefail
          SOURCE_COMMIT=$(cat "$PREVIOUS_AUDIT/commit.txt")
          [[ "$SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          git merge-base --is-ancestor "$SOURCE_COMMIT" HEAD
          git diff --exit-code "$SOURCE_COMMIT" HEAD -- mobile ':!mobile/visual' ':!mobile/__tests__' ':!mobile/integration' scripts/mobile-visual/configure-build.cjs
          # Test selectors and outcome gates may evolve without changing the binary.
          # Still require the workflow's environment and native build steps to match.
          python3 - "$SOURCE_COMMIT" <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          workflow = '.github/workflows/mobile-visual-audit.yml'
          marker = '      - name: Preserve simulator binary for additional flows'
          original = subprocess.check_output(['git', 'show', f'{sys.argv[1]}:{workflow}'], text=True)
          current = Path(workflow).read_text()
          if marker not in original or original.split(marker)[0] != current.split(marker)[0]:
              raise SystemExit('Native build configuration changed; rebuild the simulator app')
          PY
          mkdir -p mobile/build/visual/Build/Products/Release-iphonesimulator
          tar -xzf "$PREVIOUS_AUDIT/simulator-app.tar.gz" -C mobile/build/visual/Build/Products/Release-iphonesimulator
          cp "$PREVIOUS_AUDIT/simulator-app.tar.gz" mobile/test-results/native-visual/
          printf '%s\n' "$SOURCE_COMMIT" > mobile/test-results/native-visual/binary-source.txt
      - name: Install Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev -o "$RUNNER_TEMP/install-maestro.sh"
          bash "$RUNNER_TEMP/install-maestro.sh"
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Boot simulator and install app
        timeout-minutes: 10
        run: |
          set -euxo pipefail
          node scripts/mobile-visual/fixture-server.cjs > mobile/test-results/native-visual/fixture.log 2>&1 &
          xcrun simctl boot "$SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          xcrun simctl status_bar "$SIMULATOR_UDID" override --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
          xcrun simctl install "$SIMULATOR_UDID" mobile/build/visual/Build/Products/Release-iphonesimulator/BBTalk.app
          python3 scripts/mobile-visual/seed-settings.py "$SIMULATOR_UDID"
      # Keep authentication separate so a driver snapshot crash after a valid
      # login does not discard the entire screen audit. Its outcome still gates.
      - name: Audit login and service selection
        id: login
        timeout-minutes: 10
        continue-on-error: true
        run: maestro --device "$SIMULATOR_UDID" test --test-output-dir mobile/test-results/native-visual/maestro-login mobile/visual/login.yaml
      - name: Audit primary screens
        if: inputs.audit_scope != 'welcome'
        id: primary
        timeout-minutes: 10
        continue-on-error: true
        run: maestro --device "$SIMULATOR_UDID" test --test-output-dir mobile/test-results/native-visual/maestro mobile/visual/primary.yaml
      - name: Audit secondary screens
        if: inputs.audit_scope != 'welcome'
        id: secondary
        timeout-minutes: 10
        continue-on-error: true
        run: |
          xcrun simctl terminate "$SIMULATOR_UDID" com.chewy.bbtalk || true
          maestro --device "$SIMULATOR_UDID" test --test-output-dir mobile/test-results/native-visual/maestro-secondary mobile/visual/secondary.yaml
      - name: Audit large text and keyboard
        if: inputs.audit_scope != 'welcome'
        id: large
        timeout-minutes: 10
        continue-on-error: true
        run: |
          xcrun simctl terminate "$SIMULATOR_UDID" com.chewy.bbtalk || true
          xcrun simctl ui "$SIMULATOR_UDID" content_size accessibility-large
          maestro --device "$SIMULATOR_UDID" test --test-output-dir mobile/test-results/native-visual/maestro-large mobile/visual/large-text.yaml
          xcrun simctl io "$SIMULATOR_UDID" screenshot mobile/test-results/native-visual/account-large-direct.png
      - name: Audit media controls
        if: inputs.audit_scope != 'welcome'
        id: media
        timeout-minutes: 10
        continue-on-error: true
        run: |
          xcrun simctl terminate "$SIMULATOR_UDID" com.chewy.bbtalk || true
          xcrun simctl ui "$SIMULATOR_UDID" content_size large
          maestro --device "$SIMULATOR_UDID" test --test-output-dir mobile/test-results/native-visual/maestro-media mobile/visual/media.yaml
      - name: Audit recording and navigation restoration
        if: inputs.audit_scope != 'welcome'
        id: voice
        timeout-minutes: 10
        continue-on-error: true
        run: |
          curl --fail --silent --show-error -X POST http://localhost:8020/__visual__/empty
          xcrun simctl terminate "$SIMULATOR_UDID" com.chewy.bbtalk || true
          maestro --device "$SIMULATOR_UDID" test --test-output-dir mobile/test-results/native-visual/maestro-voice mobile/visual/voice.yaml
      - name: Audit native edge back gesture
        if: inputs.audit_scope != 'welcome'
        id: navigation
        timeout-minutes: 5
        continue-on-error: true
        run: |
          xcrun simctl terminate "$SIMULATOR_UDID" com.chewy.bbtalk || true
          maestro --device "$SIMULATOR_UDID" test --test-output-dir mobile/test-results/native-visual/maestro-navigation mobile/visual/navigation.yaml
      - name: Audit personal welcome page
        id: welcome
        timeout-minutes: 10
        continue-on-error: true
        run: |
          curl --fail --silent --show-error -X POST http://localhost:8020/__visual__/welcome
          xcrun simctl terminate "$SIMULATOR_UDID" com.chewy.bbtalk || true
          xcrun simctl ui "$SIMULATOR_UDID" content_size large
          maestro --device "$SIMULATOR_UDID" test --test-output-dir mobile/test-results/native-visual/maestro-welcome mobile/visual/welcome.yaml
      - name: Collect native evidence
        if: always()
        timeout-minutes: 2
        run: |
          git rev-parse HEAD > mobile/test-results/native-visual/commit.txt
          xcrun simctl io "$SIMULATOR_UDID" screenshot mobile/test-results/native-visual/final-screen.png || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-native-visual
          path: mobile/test-results/native-visual/
          retention-days: 14
      - name: Require all native flows to pass
        if: always()
        env:
          LOGIN: ${{ steps.login.outcome }}
          PRIMARY: ${{ steps.primary.outcome }}
          SECONDARY: ${{ steps.secondary.outcome }}
          LARGE: ${{ steps.large.outcome }}
          MEDIA: ${{ steps.media.outcome }}
          VOICE: ${{ steps.voice.outcome }}
          NAVIGATION: ${{ steps.navigation.outcome }}
          WELCOME: ${{ steps.welcome.outcome }}
          SCOPE: ${{ inputs.audit_scope }}
        run: |
          test "$LOGIN" = success || exit 1
          test "$WELCOME" = success || exit 1
          if [ "$SCOPE" != welcome ]; then
            for outcome in "$PRIMARY" "$SECONDARY" "$LARGE" "$MEDIA" "$VOICE" "$NAVIGATION"; do
              test "$outcome" = success || exit 1
            done
          fi

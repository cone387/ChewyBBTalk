appId: com.chewy.bbtalk
---
- launchApp
- tapOn:
    id: tab-mine
- tapOn: "账号与安全"
- assertVisible:
    id: BackButton
- waitForAnimationToEnd
# Exercise the actual screen edge, independently of the page screenshot tour.
- swipe:
    start: 0%, 50%
    end: 90%, 50%
    duration: 300
- assertVisible:
    id: tab-mine
- takeScreenshot: edge-back-restored
- tapOn: "账号与安全"
- waitForAnimationToEnd
- swipe:
    start: 35%, 45%
    end: 95%, 45%
    duration: 400
- assertVisible:
    id: tab-mine
- takeScreenshot: content-back-restored

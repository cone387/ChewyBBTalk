appId: com.chewy.bbtalk
---
- launchApp
- extendedWaitUntil:
    visible: ".*今天的风很舒服.*"
    timeout: 60000
- takeScreenshot: home
- tapOn: "新建碎碎念"
- extendedWaitUntil:
    visible: "记录内容.*"
    timeout: 10000
- takeScreenshot: compose-keyboard
- inputText: "Native visual check"
- takeScreenshot: compose-filled-keyboard
- tapOn: "切换到预览模式"
- takeScreenshot: compose-preview
- tapOn: "切换到编辑模式"
- tapOn: "取消"
- tapOn:
    text: "丢弃.*"
    optional: true
- tapOn:
    id: tab-calendar
- takeScreenshot: calendar
- tapOn: "选择年月"
- tapOn: "年份"
- takeScreenshot: calendar-year-keyboard
- tapOn: "收起年份键盘"
- tapOn: "取消"
- tapOn:
    id: tab-mine
- takeScreenshot: settings
- tapOn: "账号与安全"
- takeScreenshot: account-security
- tapOn:
    id: BackButton
- tapOn: "编辑个人信息"
- takeScreenshot: profile
- tapOn:
    id: profile-bio
- takeScreenshot: profile-keyboard
- tapOn:
    id: BackButton
- tapOn: "防窥设置"
- takeScreenshot: privacy
- tapOn:
    id: BackButton
- tapOn: "备份与导出"
- takeScreenshot: data
- tapOn:
    id: BackButton
- tapOn: "标签管理"
- takeScreenshot: tags
- tapOn:
    id: BackButton
- tapOn: "外观"
- tapOn: "深色主题"
- takeScreenshot: themes-dark
- tapOn:
    id: BackButton
- takeScreenshot: settings-dark
- tapOn:
    id: tab-records
- takeScreenshot: home-dark
- tapOn: "新建碎碎念"
- takeScreenshot: compose-dark-keyboard
- tapOn: "取消"

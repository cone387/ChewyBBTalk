appId: com.chewy.bbtalk
---
- launchApp:
    permissions:
      all: allow
- extendedWaitUntil:
    visible: "录一段语音"
    timeout: 60000
- tapOn: "录一段语音"
- extendedWaitUntil:
    visible: "点击下方按钮结束录音"
    timeout: 15000
- extendedWaitUntil:
    visible: "(0:(0[1-9]|[1-5][0-9])|[1-9][0-9]*:[0-5][0-9])"
    timeout: 15000
- assertNotVisible:
    id: tab-calendar
- takeScreenshot: recording-active
- tapOn: "取消录音"
- assertVisible:
    id: tab-calendar
- tapOn: "录一段语音"
- extendedWaitUntil:
    visible: "(0:(0[1-9]|[1-5][0-9])|[1-9][0-9]*:[0-5][0-9])"
    timeout: 15000
- tapOn: "结束录音"
- extendedWaitUntil:
    visible: "记录内容.*"
    timeout: 15000
- extendedWaitUntil:
    visible: "(播放|暂停)录音"
    timeout: 15000
- takeScreenshot: recording-result
- tapOn: "取消"
- tapOn:
    text: "丢弃.*"
    optional: true

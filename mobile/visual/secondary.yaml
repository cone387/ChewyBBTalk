appId: com.chewy.bbtalk
---
- launchApp
- extendedWaitUntil:
    visible: "新建碎碎念"
    timeout: 60000
- tapOn:
    text: "更多操作"
    index: 0
- takeScreenshot: record-actions
- runFlow:
    when:
      visible: "取消"
    commands:
      - tapOn: "取消"
# iOS 26 presents this system action sheet as a popover without a cancel row.
# The inspected native screenshot places its top at 223pt; 20% is outside it.
- runFlow:
    when:
      visible: "操作"
    commands:
      - tapOn:
          point: "10%,20%"
- assertNotVisible: "操作"
- tapOn:
    text: "评论"
    index: 0
- extendedWaitUntil:
    visible: "评论内容.*"
    timeout: 10000
- inputText: "A short comment"
- takeScreenshot: comment-keyboard
- tapOn: "关闭评论"
- assertNotVisible: "评论内容.*"
- tapOn: ".*碎碎念：今天的风很舒服.*"
- takeScreenshot: record-detail
- tapOn:
    id: BackButton
- tapOn:
    id: tab-mine
- scrollUntilVisible:
    element:
      text: "高级设置"
    direction: DOWN
- tapOn: "高级设置"
- takeScreenshot: advanced
- tapOn: ".*附件存储.*"
- takeScreenshot: storage
- tapOn:
    id: BackButton
- tapOn: ".*缓存管理.*"
- takeScreenshot: cache
- tapOn:
    id: BackButton
- tapOn:
    id: BackButton
- scrollUntilVisible:
    element:
      text: "帮助与关于"
    direction: DOWN
    centerElement: true
- tapOn: "帮助与关于"
- assertVisible: "检查更新"
- takeScreenshot: about
